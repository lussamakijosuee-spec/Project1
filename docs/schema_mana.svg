<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1a1c34"/>
      <stop offset="100%" stop-color="#06070f"/>
    </radialGradient>
    <radialGradient id="pur" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7b0"/>
      <stop offset="35%" stop-color="#ff6ec7"/>
      <stop offset="70%" stop-color="#7b6cff"/>
      <stop offset="100%" stop-color="#33e0ff"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd34d"/>
    </marker>
    <marker id="arrowR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5d6c"/>
    </marker>
  </defs>

  <rect width="1400" height="1700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="70" fill="#ffd34d" font-size="46" font-weight="bold" text-anchor="middle" letter-spacing="2">SYSTÈME DE MANA</text>
  <text x="700" y="108" fill="#9aa0c0" font-size="22" text-anchor="middle" letter-spacing="3">LES 3 SOURCES · LES BRANCHES · LES ÉLÉMENTS</text>
  <line x1="350" y1="130" x2="1050" y2="130" stroke="#ffd34d" stroke-width="2" opacity="0.5"/>

  <!-- ================= TRINITY TRIANGLE ================= -->
  <text x="700" y="185" fill="#cfe3ff" font-size="26" font-weight="bold" text-anchor="middle">① LA TRINITÉ — SOURCES PRIMORDIALES</text>

  <!-- triangle edges -->
  <polygon points="700,250 360,820 1040,820" fill="none" stroke="#3a3f66" stroke-width="3"/>

  <!-- center: Mana Pur -->
  <circle cx="700" cy="640" r="78" fill="url(#pur)" filter="url(#glow)"/>
  <text x="700" y="635" fill="#1a1133" font-size="22" font-weight="bold" text-anchor="middle">MANA</text>
  <text x="700" y="662" fill="#1a1133" font-size="22" font-weight="bold" text-anchor="middle">PUR</text>
  <text x="700" y="745" fill="#ffe08a" font-size="15" text-anchor="middle">transcende tout · attaques spéciales</text>

  <!-- node: CORPS (Mana Sombre) top -->
  <circle cx="700" cy="250" r="72" fill="#15151c" stroke="#7d7d8c" stroke-width="3"/>
  <text x="700" y="245" fill="#e6e6ef" font-size="20" font-weight="bold" text-anchor="middle">CORPS</text>
  <text x="700" y="270" fill="#b9b9c8" font-size="15" text-anchor="middle">Mana Sombre</text>

  <!-- node: ÂME left -->
  <circle cx="360" cy="820" r="72" fill="#9b1840" stroke="#ff5d83" stroke-width="3"/>
  <text x="360" y="815" fill="#ffe3ec" font-size="20" font-weight="bold" text-anchor="middle">ÂME</text>
  <text x="360" y="840" fill="#ffc7d6" font-size="15" text-anchor="middle">Mana Spirituelle</text>

  <!-- node: ESPRIT right -->
  <circle cx="1040" cy="820" r="72" fill="#13486b" stroke="#42c6ff" stroke-width="3"/>
  <text x="1040" y="815" fill="#dff4ff" font-size="20" font-weight="bold" text-anchor="middle">ESPRIT</text>
  <text x="1040" y="840" fill="#aee3ff" font-size="15" text-anchor="middle">Mana Originel</text>

  <!-- ================= SECONDARY BRANCHES ================= -->
  <text x="700" y="980" fill="#cfe3ff" font-size="26" font-weight="bold" text-anchor="middle">② LES BRANCHES SECONDAIRES (magie utilisable)</text>

  <!-- Négatif -->
  <rect x="120" y="1015" rx="16" width="340" height="150" fill="#241433" stroke="#9a5cff" stroke-width="3"/>
  <text x="290" y="1055" fill="#c9a6ff" font-size="22" font-weight="bold" text-anchor="middle">MANA NÉGATIF</text>
  <text x="290" y="1085" fill="#9aa0c0" font-size="14" text-anchor="middle">issu du CORPS · Empire Vultric</text>
  <text x="290" y="1112" fill="#e6e6ef" font-size="14" text-anchor="middle">émotions → force physique</text>
  <text x="290" y="1138" fill="#ff8a8a" font-size="13" text-anchor="middle">contrepartie : draine les PV</text>

  <!-- Spirituelle -->
  <rect x="530" y="1015" rx="16" width="340" height="150" fill="#33141f" stroke="#ff5d83" stroke-width="3"/>
  <text x="700" y="1055" fill="#ffb3c6" font-size="22" font-weight="bold" text-anchor="middle">MANA SPIRITUELLE</text>
  <text x="700" y="1085" fill="#9aa0c0" font-size="14" text-anchor="middle">issu de l'ÂME · invocateurs, Lou</text>
  <text x="700" y="1112" fill="#e6e6ef" font-size="14" text-anchor="middle">manipulation des âmes</text>
  <text x="700" y="1138" fill="#ff8a8a" font-size="13" text-anchor="middle">contrepartie : traumas / cauchemars</text>

  <!-- Positif -->
  <rect x="940" y="1015" rx="16" width="340" height="150" fill="#10283d" stroke="#42c6ff" stroke-width="3"/>
  <text x="1110" y="1055" fill="#a6ddff" font-size="22" font-weight="bold" text-anchor="middle">MANA POSITIF</text>
  <text x="1110" y="1085" fill="#9aa0c0" font-size="14" text-anchor="middle">issu de l'ESPRIT · Sorcières des Étoiles</text>
  <text x="1110" y="1112" fill="#e6e6ef" font-size="14" text-anchor="middle">intelligence, soin, eau, cosmos</text>
  <text x="1110" y="1138" fill="#ffd34d" font-size="13" text-anchor="middle">faiblit si mauvaise santé mentale</text>

  <!-- ================= CYCLE (Pokemon style) ================= -->
  <text x="700" y="1245" fill="#cfe3ff" font-size="26" font-weight="bold" text-anchor="middle">③ LE CYCLE DES AVANTAGES (×1.5 / ×0.5)</text>

  <!-- three cycle nodes -->
  <circle cx="700" cy="1330" r="52" fill="#241433" stroke="#9a5cff" stroke-width="3"/>
  <text x="700" y="1336" fill="#c9a6ff" font-size="16" font-weight="bold" text-anchor="middle">NÉGATIF</text>

  <circle cx="470" cy="1500" r="52" fill="#33141f" stroke="#ff5d83" stroke-width="3"/>
  <text x="470" y="1497" fill="#ffb3c6" font-size="15" font-weight="bold" text-anchor="middle">ÂME</text>
  <text x="470" y="1515" fill="#ffb3c6" font-size="12" text-anchor="middle">Spirituelle</text>

  <circle cx="930" cy="1500" r="52" fill="#10283d" stroke="#42c6ff" stroke-width="3"/>
  <text x="930" y="1503" fill="#a6ddff" font-size="16" font-weight="bold" text-anchor="middle">POSITIF</text>

  <!-- arrows: Negatif -> Ame -> Positif -> Negatif -->
  <path d="M662,1370 C600,1420 540,1450 505,1462" fill="none" stroke="#ffd34d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M522,1500 C640,1525 760,1525 878,1500" fill="none" stroke="#ffd34d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M895,1462 C860,1450 800,1420 738,1370" fill="none" stroke="#ffd34d" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="560" y="1405" fill="#ffe08a" font-size="13" text-anchor="middle">bat</text>
  <text x="700" y="1545" fill="#ffe08a" font-size="13" text-anchor="middle">bat</text>
  <text x="840" y="1405" fill="#ffe08a" font-size="13" text-anchor="middle">bat</text>

  <text x="700" y="1625" fill="#9aa0c0" font-size="15" text-anchor="middle">👑 Le MANA PUR ignore ce cycle et toutes les résistances élémentaires.</text>
  <text x="700" y="1652" fill="#7e84a3" font-size="13" text-anchor="middle">Sous-branche 1/1000 : Mana Semi-Parfait — au risque de défier la réalité.</text>
</svg>
